name: AI Router CI

on:
  push:
    branches: ["ai-router-v1"]
  pull_request:
    branches: ["ai-router-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: |
          node --check ai-router/core.js
          node --check ai-router/app.js
          node --check ai-router/tests/core.test.cjs

      - name: Run planner tests
        run: node --test ai-router/tests/core.test.cjs

      - name: Check Python syntax
        run: python -m py_compile ai-router/backend/server.py ai-router/backend/store.py ai-router/backend/providers.py ai-router/backend/backup.py ai-router/backend/test_backend.py

      - name: Run backend persistence and API tests
        run: python -m unittest discover -s ai-router/backend -p "test_*.py" -v
